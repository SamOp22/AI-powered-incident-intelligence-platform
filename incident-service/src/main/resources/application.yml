spring:
  application:
    name: incident-service

  datasource:
    url: jdbc:postgresql://localhost:5433/incidentdb
    username: incident
    password: incident
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

  flyway:
    enabled: false

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health